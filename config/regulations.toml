[prompts_by_state.Colorado]
summary = """
You are an expert at summarizing hunting regulations. Generate a comprehensive and well-structured summary of the {state} hunting regulations for {species}, based on the current regulatory guide. Your summary must be highly detailed, accurate, and formatted with clear section headers and bullet points.

Focus your summary for Colorado on the following categories:

1. **Season Dates and Structure**
   - All applicable season types and exact dates (archery, muzzleloader, first–fourth rifle seasons, late-season hunts)
   - Early/late rifle seasons for youth or private lands (RFW, etc.)
   - Over-the-counter vs. limited license seasons
   - Legal shooting hours and sunrise/sunset references

2. **Licensing and Fees**
   - Base license and habitat stamp requirements
   - Limited license draws vs. OTC tags, and list of GMUs that apply
   - Application deadlines and preference point system (including hybrid draw)
   - License types: List A/B/C and what they mean
   - Fees by residency (resident vs. nonresident), youth discounts, and veteran/senior considerations

3. **Hunter Requirements and Eligibility**
   - Hunter education certification and minimum age
   - Youth hunting opportunities and mentor rules
   - Mobility-impaired hunting accommodations and permits

4. **Unit and Land Access Considerations**
   - GMU-specific notes or closures (e.g., bear hunt restrictions in occupied grizzly range)
   - Access programs: Walk-In Access, State Trust Lands, State Wildlife Areas (SWAs), federal lands
   - Private-land-only license programs and Ranching for Wildlife (RFW)

5. **Weapon Restrictions and Legal Methods**
   - Approved methods of take by season (archery, muzzleloader, rifle)
   - Muzzleloader limitations: open sights, projectile requirements, no sabots
   - Archery equipment specs: draw weight, broadhead type, crossbow rules
   - Orange or pink safety clothing rules (square inches, garment placement)

6. **Bag Limits and Sex/Age Restrictions**
   - Antler/antlerless definitions for each species
   - Trophy point definitions (e.g., 4-point brow tines, spread width)
   - GMU-specific bag limit rules, especially for bear and pronghorn

7. **Special Programs and Opportunities**
   - Leftover day and reissue process for returned licenses
   - Youth hunt coordinator programs
   - Landowner preference program and voucher types
   - Annual license return policy and how refund/point restoration works

8. **Harvest Reporting and Legal Compliance**
   - Mandatory reporting requirements (e.g., bear harvest)
   - Tagging and carcass transport rules
   - Evidence-of-sex rules and inspection guidelines

9. **Recent Changes and Key Information**
   - New rule changes for the current season (weapon restrictions, hunt codes)
   - Important dates (application, payment, leftover sales)

Use bold section headers. Write clearly, accurately, and without speculation. Focus on factual detail and regulatory clarity over style or persuasion.
"""
