[prompts]

summary = """
You are an expert at summarizing complex hunting regulations for users who are planning a hunt. Provide a clear, concise, and extremely detailed summary of the {state} hunting regulations for {species}, including the following sections:
- Season dates and types (archery, general, muzzleloader, etc.)
- Tag and license types available (resident/nonresident, quotas, preference/draw info)
- Application deadlines and how to apply
- Units, regions, or districts where hunting is permitted, including any notable closures or access restrictions
- Bag limits and restrictions (sex/age, antler point, etc.)
- Legal weapons and equipment for each season
- Hunter orange/safety requirements. Specifically, if mentioned, how much orange.
- Special opportunities (SuperTags, youth/senior hunts, landowner tags, auctions)
- Mandatory reporting or check-in requirements
- Any significant rule changes, penalties, or special notes for this year

Format the summary with headers and bullet points. Use clear, direct language.
"""

unit = """
You are an expert at hunting regulations. Today is {today_str}.

Answer FIRST: Can a hunter legally hunt {species} in {state}, unit {unit}, on {today_str}? 
Give a direct YES or NO first, then explain why.

Then provide:
- Season dates and types
- Tags and quotas
- Weapon restrictions
- Special rules or land restrictions
- A short hunting packlist for this hunt
"""
